# GitHub Actions CI.
#
# This and azure-pipelines.yml run the same three checks. GitHub Actions is the
# one wired to this repo, because it needs no billing link and gives the badge
# in the README. The Azure pipeline is the same gate expressed for Azure
# DevOps, which is what I would be using in a team that standardised on it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Tests assert on relative dates and runners are UTC. Pin the timezone
      # the app is used in, or "today" lands on the wrong side of midnight.
      TZ: Australia/Melbourne

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ci, not install: fails loudly if the lockfile and package.json have
      # drifted, rather than quietly resolving something different to local.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
